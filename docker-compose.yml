# ============================================
# TsuniForge — Local Development Infrastructure
# ============================================
# Usage: docker-compose up -d
# ============================================

services:
  # ─── PostgreSQL ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tsuniforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tsuniforge
      POSTGRES_PASSWORD: tsuniforge_secret
      POSTGRES_DB: tsuniforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsuniforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tsuniforge-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── MongoDB ─────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: tsuniforge-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: tsuniforge
      MONGO_INITDB_ROOT_PASSWORD: tsuniforge_secret
      MONGO_INITDB_DATABASE: tsuniforge
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3-compatible storage) ───────────
  minio:
    image: minio/minio
    container_name: tsuniforge-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: tsuniforge
      MINIO_ROOT_PASSWORD: tsuniforge_secret
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis Commander (Dev UI) ────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: tsuniforge-redis-ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    profiles:
      - dev-tools

  # ─── Adminer (DB UI) ────────────────────────
  adminer:
    image: adminer
    container_name: tsuniforge-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - dev-tools

volumes:
  postgres_data:
  redis_data:
  mongodb_data:
  minio_data:
