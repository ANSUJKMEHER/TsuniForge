# ============================================
# TsuniForge — Nginx Reverse Proxy
# ============================================
# Proxies API requests to the NestJS container
# Handles SSL termination via Let's Encrypt
# ============================================

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# ─── HTTP (Port 80) ─────────────────────────
# Used for Let's Encrypt validation and HTTP→HTTPS redirect
server {
    listen 80;
    server_name _;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # API proxy (HTTP — works before SSL is set up)
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for real-time submission updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # CORS headers for the frontend on Vercel
    location / {
        # Return 204 for CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        return 301 https://$host$request_uri;
    }
}

